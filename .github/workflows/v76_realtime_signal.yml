name: V7.6 Realtime Signal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime_signal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore generated market-data caches
        uses: actions/cache@v5
        with:
          path: |
            .cn_official_cache
            .cboe_cache
            .sse_510300_chain_cache
            .sse_option_stats_cache
          key: v76-realtime-signal-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            v76-realtime-signal-${{ runner.os }}-

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests matplotlib xlsxwriter fastapi-poe

      - name: Run V7.6 realtime signal
        id: signal
        shell: bash
        run: |
          set +e
          python "mnt_bot V 7.6 plus.py" "实时信号" 2>&1 | tee v76_realtime_signal_result.txt
          status=${PIPESTATUS[0]}
          if grep -E "查询入口失败|查询失败" v76_realtime_signal_result.txt; then
            status=1
          fi
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload realtime signal output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v76-realtime-signal-output
          path: v76_realtime_signal_result.txt
          if-no-files-found: error
          retention-days: 30

      - name: Add realtime signal result to job summary
        if: always()
        run: |
          {
            echo "## V7.6 realtime signal"
            echo
            echo "- Script exit code: ${{ steps.signal.outputs.exit_code }}"
            echo "- Artifact: v76-realtime-signal-output"
            echo
            echo '```text'
            cat v76_realtime_signal_result.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail job when realtime signal script failed
        if: steps.signal.outputs.exit_code != '0'
        run: exit 1
