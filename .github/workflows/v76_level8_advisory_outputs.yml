name: V7.6 Level-8 Advisory Outputs

on:
  schedule:
    # 13:45 Asia/Shanghai == 05:45 UTC.
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  level8_advisory_outputs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests akshare matplotlib xlsxwriter fastapi-poe

      - name: Clone Microcap sibling strategy
        run: |
          git clone --depth 1 https://github.com/liuruojiang/microcap.git ../microcap

      - name: Restore generated market-data caches
        uses: actions/cache@v5
        with:
          path: |
            .cn_official_cache
            .cboe_cache
            .sse_510300_chain_cache
            .sse_option_stats_cache
            ../microcap/outputs
            ../microcap/.microcap_index_cache
            ../microcap/.microcap_ohlc_cache
          key: v76-level8-advisory-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            v76-level8-advisory-${{ runner.os }}-
            v76-realtime-signal-${{ runner.os }}-

      - name: Build Microcap v2.0 source output
        id: microcap
        shell: bash
        run: |
          set +e
          (
            cd ../microcap
            python microcap_top100_mom16_biweekly_live_v2_0.py
          ) 2>&1 | tee microcap_v2_0_source_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Refresh five-sleeve source returns
        id: source_returns
        if: steps.microcap.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v20_rebalance_validation/run_real_subd_v20_rebalance_validation.py 2>&1 | tee v76_level8_source_returns_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Build portfolio and Level-8 advisory outputs
        id: build
        if: steps.microcap.outputs.exit_code == '0' && steps.source_returns.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          {
            python build_v76_portfolio_nav.py
            python build_v76_level8_decision_dashboard.py
            python build_v76_level8_risk_governance.py
            python poe_v76_level8_advisory_bot.py
          } 2>&1 | tee v76_level8_advisory_outputs_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload advisory outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v76-level8-advisory-outputs
          path: |
            microcap_v2_0_source_result.txt
            v76_level8_source_returns_result.txt
            v76_level8_advisory_outputs_result.txt
            quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v20_rebalance_validation/aligned_five_sleeve_real_subd_returns.csv
            quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v20_rebalance_validation/record.md
            outputs/portfolio_v76_current/**
          if-no-files-found: error
          retention-days: 30

      - name: Add advisory result to job summary
        if: always()
        run: |
          {
            echo "# V7.6 Level-8 Advisory"
            echo
            if [ -f outputs/portfolio_v76_current/level8_action_summary.md ]; then
              cat outputs/portfolio_v76_current/level8_action_summary.md
            else
              echo "## 今日执行仓位"
              echo
              echo "- 状态: 输出生成失败或尚未生成。"
              echo "- 操作: 不调仓，先检查下面的运行状态。"
            fi
            echo
            echo "## 运行状态"
            echo
            echo "| 阶段 | Exit code |"
            echo "|---|---:|"
            echo "| Microcap v2.0 source | ${{ steps.microcap.outputs.exit_code }} |"
            echo "| Five-sleeve source returns | ${{ steps.source_returns.outputs.exit_code }} |"
            echo "| Portfolio/advisory build | ${{ steps.build.outputs.exit_code }} |"
            echo
            echo "- Artifact: v76-level8-advisory-outputs"
            echo
            echo "<details><summary>排错日志：Microcap source tail</summary>"
            echo
            echo '```text'
            tail -n 80 microcap_v2_0_source_result.txt || true
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>排错日志：Source returns tail</summary>"
            echo
            echo '```text'
            tail -n 80 v76_level8_source_returns_result.txt || true
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>排错日志：Advisory output tail</summary>"
            echo
            echo '```text'
            tail -n 120 v76_level8_advisory_outputs_result.txt || true
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Commit refreshed advisory outputs
        if: steps.microcap.outputs.exit_code == '0' && steps.source_returns.outputs.exit_code == '0' && steps.build.outputs.exit_code == '0' && github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            outputs/portfolio_v76_current \
            quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v20_rebalance_validation/aligned_five_sleeve_real_subd_returns.csv \
            quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v20_rebalance_validation/command_log.txt \
            quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v20_rebalance_validation/nav_outputs.csv \
            quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v20_rebalance_validation/record.md \
            quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v20_rebalance_validation/scan_meta.json \
            quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v20_rebalance_validation/scan_summary.csv \
            quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v20_rebalance_validation/subd_v1_1_daily.csv \
            quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v20_rebalance_validation/subd_v1_1_data_quality.csv \
            quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v20_rebalance_validation/subd_v1_1_sources.csv \
            quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v20_rebalance_validation/weight_diagnostics.csv \
            quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v20_rebalance_validation/window_metrics.csv
          if git diff --cached --quiet; then
            echo "No Level-8 output changes to commit."
          else
            git commit -m "Update V7.6 Level-8 advisory outputs [skip ci]"
            branch_name="${GITHUB_REF_NAME:-main}"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${branch_name}"; then
                exit 0
              fi
              echo "Push rejected on attempt ${attempt}; rebasing onto origin/${branch_name} and retrying."
              git fetch origin "${branch_name}"
              git rebase "origin/${branch_name}"
            done
            echo "Failed to push refreshed Level-8 outputs after rebase retries."
            exit 1
          fi

      - name: Fail job when advisory output build failed
        if: steps.microcap.outputs.exit_code != '0' || steps.source_returns.outputs.exit_code != '0' || steps.build.outputs.exit_code != '0'
        run: exit 1
