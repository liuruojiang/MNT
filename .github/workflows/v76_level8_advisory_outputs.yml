name: V7.6 Level-8 Advisory Outputs

on:
  schedule:
    # 13:45 Asia/Shanghai == 05:45 UTC.
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  level8_advisory_outputs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      QVERIS_API_KEY: ${{ secrets.QVERIS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests akshare matplotlib xlsxwriter fastapi-poe

      - name: Clone Microcap sibling strategy
        run: |
          git clone --depth 1 https://github.com/liuruojiang/microcap.git ../microcap

      - name: Restore generated market-data caches
        uses: actions/cache@v5
        with:
          path: |
            .cn_official_cache
            .cboe_cache
            .sse_510300_chain_cache
            .sse_option_stats_cache
            ../microcap/outputs
            ../microcap/.microcap_index_cache
            ../microcap/.microcap_ohlc_cache
          key: v76-level8-advisory-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            v76-level8-advisory-${{ runner.os }}-
            v76-realtime-signal-${{ runner.os }}-

      - name: Build Microcap v1.6 source output
        id: microcap
        shell: bash
        run: |
          set +e
          (
            cd ../microcap
            python microcap_top100_mom16_biweekly_live_v1_6.py
          ) 2>&1 | tee microcap_v1_6_source_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Refresh five-sleeve source returns
        id: source_returns
        if: steps.microcap.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v16_rebalance_validation/run_real_subd_v16_rebalance_validation.py 2>&1 | tee v76_level8_source_returns_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Build portfolio and Level-8 advisory outputs
        id: build
        if: steps.microcap.outputs.exit_code == '0' && steps.source_returns.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          {
            python build_v76_portfolio_nav.py
            python build_v76_level8_decision_dashboard.py
            python build_v76_level8_risk_governance.py
            python poe_v76_level8_advisory_bot.py
          } 2>&1 | tee v76_level8_advisory_outputs_result.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload advisory outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v76-level8-advisory-outputs
          path: |
            microcap_v1_6_source_result.txt
            v76_level8_source_returns_result.txt
            v76_level8_advisory_outputs_result.txt
            quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v16_rebalance_validation/aligned_five_sleeve_real_subd_returns.csv
            quant_param_scan_runs/20260512_v76_five_sleeve_real_subd_v16_rebalance_validation/record.md
            outputs/portfolio_v76_current/**
          if-no-files-found: error
          retention-days: 30

      - name: Add advisory result to job summary
        if: always()
        run: |
          {
            echo "## V7.6 Level-8 advisory outputs"
            echo
            echo "- Microcap source exit code: ${{ steps.microcap.outputs.exit_code }}"
            echo "- Source returns exit code: ${{ steps.source_returns.outputs.exit_code }}"
            echo "- Script exit code: ${{ steps.build.outputs.exit_code }}"
            echo "- Raw paths consumed by Poe:"
            echo "  - outputs/portfolio_v76_current/level8_decision_dashboard.csv"
            echo "  - outputs/portfolio_v76_current/level8_risk_governance.csv"
            echo "- Artifact: v76-level8-advisory-outputs"
            echo
            echo "### Microcap source tail"
            echo '```text'
            tail -n 80 microcap_v1_6_source_result.txt || true
            echo '```'
            echo
            echo "### Source returns tail"
            echo '```text'
            tail -n 80 v76_level8_source_returns_result.txt || true
            echo '```'
            echo
            echo "### Advisory output tail"
            echo '```text'
            tail -n 120 v76_level8_advisory_outputs_result.txt || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Commit refreshed raw outputs
        if: steps.microcap.outputs.exit_code == '0' && steps.source_returns.outputs.exit_code == '0' && steps.build.outputs.exit_code == '0' && github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/portfolio_v76_current
          if git diff --cached --quiet; then
            echo "No Level-8 output changes to commit."
          else
            git commit -m "Update V7.6 Level-8 advisory outputs [skip ci]"
            git push
          fi

      - name: Fail job when advisory output build failed
        if: steps.microcap.outputs.exit_code != '0' || steps.source_returns.outputs.exit_code != '0' || steps.build.outputs.exit_code != '0'
        run: exit 1
